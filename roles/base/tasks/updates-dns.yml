# roles/base/tasks/updates-dns.yml
# Update all DNS configurations.

# Include variables
- name: Import | Include variable files.
  ansible.builtin.include_vars:
    dir: "{{ ansible_dir }}/roles/dns_servers/vars"

# Update unbound configuration
- name: DNS | unbound | Update root hints file.
  ansible.builtin.get_url:
    url: https://www.internic.net/domain/named.root
    dest: /etc/unbound/root.hints
    owner: root
    group: root
    mode: 0664

- name: DNS | unbound | Update config file.
  ansible.builtin.template:
    src: "{{ ansible_dir }}/roles/dns_servers/templates/unbound.conf.j2"
    dest: /etc/unbound/unbound.conf
    owner: unbound
    group: unbound
    mode: 0640

# Update lego
- name: DNS | lego | Get latest binary releases.
  ansible.builtin.uri:
    url: https://api.github.com/repos/go-acme/lego/releases/latest
    headers:
      #ref: https://docs.github.com/en/rest/using-the-rest-api/getting-started-with-the-rest-api?apiVersion=2026-03-10#accept
      Accept: "application/vnd.github+json"
    return_content: true
    method: GET
  register: lego_release

- name: DNS | lego | Find latest linux_amd64 url.
  ansible.builtin.set_fact:
    lego_url: >-
      {{
        lego_release.json.assets
        | selectattr('name', 'search', 'linux_amd64\.tar\.gz$')
        | map(attribute='browser_download_url')
        | first
      }}

- name: DNS | lego | Download binary package.
  ansible.builtin.get_url:
    url: "{{ lego_url }}"
    dest: /tmp/lego.tar.gz
    owner: root
    group: root
    mode: 0755

- name: DSN | lego | Unzip binary.
  ansible.builtin.unarchive:
    src: /tmp/lego.tar.gz
    dest: /sbin/
    owner: root
    group: root
    mode: 0755
    remote_src: true

# Update adguard configuration
- name: DNS | adguard | Update config file.
  ansible.builtin.template:
    src: "{{ ansible_dir }}/roles/dns_servers/templates/adguard-config.yaml.j2"
    dest: /opt/AdGuardHome/AdGuardHome.yaml
    owner: root
    group: root
    mode: 0640

# Update AdGuardHome
- name: DNS | adguard | Download latest binary package.
  ansible.builtin.get_url:
    url: https://static.adguard.com/adguardhome/release/AdGuardHome_linux_amd64.tar.gz
    dest: /tmp/adguard.tar.gz
    owner: root
    group: root
    mode: 0755

- name: DNS | adguard | Unzip archive package.
  ansible.builtin.unarchive:
    src: /tmp/adguard.tar.gz
    dest: /opt/
    owner: root
    group: root
    mode: 0755
    remote_src: true
